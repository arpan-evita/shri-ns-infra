<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shri NS Infra | Premium Real Estate in NCR</title>
    <meta name="description" content="RERA approved residential & commercial projects across Noida, Greater Noida & Delhi NCR." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload LCP-critical resource (logo only, NOT video since preload=none) -->
    <link rel="preload" href="/logo.png" as="image" />

    <!--
      font-display=optional: browser uses font ONLY if available within a strict
      time window — zero FOUT, zero CLS, no layout shift at all.
      Fonts appear on repeat visits (cached). System fonts shown first-visit.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sintony:wght@400;700&display=optional"
      rel="stylesheet"
    />

    <!-- Critical inline CSS: body background + font fallback stack that visually
         matches Poppins/Sintony to prevent layout shift on font swap -->
    <style>
      /* Fallback font stack sized to approximate Poppins metrics */
      :root {
        --font-heading: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-body: 'Sintony', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #0a0906;
        color: #fff;
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent page jump before JS runs */
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
