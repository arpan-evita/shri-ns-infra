<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shri NS Infra | Premium Real Estate in NCR</title>
    <meta name="description" content="RERA approved residential & commercial projects across Noida, Greater Noida & Delhi NCR." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://gbrdsywdxftwcxzqogxt.supabase.co" />

    <!-- Preload LCP-critical resources -->
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/banner-video.mp4" as="video" type="video/mp4" />

    <!-- Google Fonts: only load weights actually used, with display=swap to prevent FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sintony:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Sintony:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Critical inline CSS: prevent FOUC while fonts load -->
    <style>
      body {
        background: #0a0906;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
